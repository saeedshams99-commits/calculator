            toast('شرطت ثبت شد ✅'); go('bets');
          }

          /* ---------- results ---------- */
          function needCheck(b, now) {
            return b.st == 'p' && b.sel.some(function (x) { return x.res == 'p' && new Date(x.time).getTime() + 105 * 60000 < now; });
          }
          function checkResults(betId) {
            var now = Date.now(), lgs = {};
            if (!key()) { toast('اول کلید API رو وارد کن'); return; }
            var pend = BETS.filter(function (b) { return b.st == 'p' && (!betId || b.id == betId); });
            if (!pend.length) { toast('شرط باز نداری'); return; }
            pend.forEach(function (b) {
              b.sel.forEach(function (x) {
                if (x.res == 'p' && new Date(x.time).getTime() + 105 * 60000 < now) { (lgs[x.lg] = lgs[x.lg] || {})[x.id] = 1; }
              });
            });
            var ks = Object.keys(lgs);
            if (!ks.length) { settle(); renderBets(); toast('هنوز بازی‌ای تموم نشده، اعتباری مصرف نشد'); return; }
            toast('در حال بررسی ' + fa(Object.keys(lgs).reduce(function (a, k) { return a + Object.keys(lgs[k]).length; }, 0)) + ' بازی...');
            var left = ks.length, ok = 0;
            ks.forEach(function (lg) {
              http(API + lg + '/scores/?apiKey=' + encodeURIComponent(key()) + '&daysFrom=3&eventIds=' + Object.keys(lgs[lg]).join(','), function (r) {
                rem(r);
                if (r.status == 200) { ok++; try { applyScores(JSON.parse(r.body)); } catch (e) {} }
                if (--left == 0) {
                  settle(); renderBets();
                  if (!ok) toast('خطا در دریافت نتایج (' + r.status + ')');
                  else if (BETS.some(function (b) { return needCheck(b, Date.now()) && (!betId || b.id == betId); })) toast('بعضی نتیجه‌ها هنوز ثبت نشدن، کمی بعد دوباره امتحان کن');
                  else toast('نتایج بروز شد');
                }
              });
            });
          }
          function applyScores(arr) {
            var map = {};
            arr.forEach(function (e) { map[e.id] = e; });
            BETS.forEach(function (b) {
              if (b.st != 'p') return;
              b.sel.forEach(function (x) {
                if (x.res != 'p') return;
                var e = map[x.id];
                if (!e || !e.completed || !e.scores) return;
                var hs = null, as = null;
                e.scores.forEach(function (s) { if (s.name == e.home_team) hs = parseInt(s.score, 10); else if (s.name == e.away_team) as = parseInt(s.score, 10); });
                if (hs === null || as === null || isNaN(hs) || isNaN(as)) return;
                var g = hs + as, p = x.pick, w;
                x.score = hs + '-' + as;
                if (p == '1') w = hs > as; else if (p == '2') w = as > hs; else if (p == 'X') w = hs == as;
                else if (p == 'BY') w = hs > 0 && as > 0; else if (p == 'BN') w = !(hs > 0 && as > 0);
                else if (p.charAt(0) == 'O') w = g > ptOf(p); else w = g < ptOf(p);
                x.res = w ? 'w' : 'l';
              });
            });
          }
          function settle() {
            var now = Date.now();
            BETS.forEach(function (b) {
              if (b.st != 'p') return;
              b.sel.forEach(function (x) { if (x.res == 'p' && now - new Date(x.time).getTime() > 84 * 3600000) x.res = 'v'; });
              if (b.sel.some(function (x) { return x.res == 'l'; })) { b.st = 'l'; return; }
              if (b.sel.every(function (x) { return x.res != 'p'; })) {
                var o = b.sel.reduce(function (a, x) { return a * (x.res == 'w' ? x.odd : 1); }, 1);
                b.win = r2(b.stake * o);
                b.st = b.sel.every(function (x) { return x.res == 'v'; }) ? 'v' : 'w';
                W.coins = r2(W.coins + b.win);
                if (b.st == 'w') toast('🎉 بردی! ' + fc(b.win) + ' سکه');
              }
            });
            saveAll();
          }
          function renderBets() {
            var el = $('bets');
            if (!BETS.length) { el.innerHTML = '<div class="empty">هنوز شرطی نبستی</div>'; return; }
            var h = '';
            BETS.forEach(function (b) {
              var st = { p: ['p', 'در انتظار'], w: ['w', 'برنده 🎉'], l: ['l', 'بازنده'], v: ['p', 'لغو شد'] }[b.st];
              h += '<div class="box"><div class="row"><b>' + (b.sel.length > 1 ? 'میکس ' + fmt(b.sel.length) + ' تایی' : 'تکی') + '</b><span class="st ' + st[0] + '">' + st[1] + '</span></div>';
              b.sel.forEach(function (x) {
                var ic = { p: '⏳', w: '✅', l: '❌', v: '↩️' }[x.res];
                h += '<div class="sl"><div class="row"><span class="ltr mut">' + esc(x.home) + ' - ' + esc(x.away) + (x.score ? ' (' + x.score + ')' : '') + '</span><span>' + ic + '</span></div>' +
                  '<div class="row"><span>' + esc(pl(x)) + '</span><b class="ltr">' + x.odd.toFixed(2) + '</b></div><div class="mut">' + tm(x.time) + '</div></div>';
              });
              var amt = b.st == 'l' ? '۰' : (b.st == 'p' ? fc(b.stake * b.odd) : '+' + fc(b.win));
              h += '<div class="row"><span class="mut">مبلغ ' + fc(b.stake) + ' | ضریب ' + b.odd.toFixed(2) + '</span><b style="color:' + (b.st == 'l' ? 'var(--red)' : 'var(--green)') + '">' + amt + '</b></div>';
              if (needCheck(b, Date.now())) h += '<div class="more" onclick="checkResults(\'' + b.id + '\')">🔄 چک نتیجه همین شرط</div>';
              h += '</div>';
            });
            el.innerHTML = h;
          }

          /* ---------- settings ---------- */
          function renderSet() {
            var r = ld('remaining', '');
            $('set').innerHTML =
              '<div class="box"><b>🔑 کلید API</b><input id="k" class="ltr" placeholder="API key" value="' + esc(key()) + '"><button class="btn blue" onclick="saveKey()">ذخیره کلید</button>' +
              (r ? '<div class="mut" style="margin-top:8px">اعتبار باقی‌مونده این ماه: ' + esc(r) + '</div>' : '') + '</div>' +
              '<div class="box"><b>🪙 مدیریت سکه</b><div class="mut">موجودی فعلی: ' + fc(W.coins) + '</div><input id="coin" type="number" step="0.01" inputmode="decimal" placeholder="تعداد سکه">' +
              '<div class="quick"><button onclick="coins(1)">➕ اضافه کن</button><button onclick="coins(0)">✏️ تنظیم موجودی</button></div></div>' +
              '<div class="box"><b>🔔 یادآور بازی</b><div class="mut">یک ساعت قبل از بازی‌هایی که روشون شرط می‌بندی (یا زنگوله‌شون رو روشن می‌کنی) نوتیفیکیشن میاد.</div></div>' +
              '<div class="box"><b>🎁 جایزه روزانه</b><div class="mut">هر ۲۴ ساعت ' + fmt(BONUS) + ' سکه رایگان</div><button class="btn" onclick="bonus()">دریافت جایزه</button></div>' +
              '<div class="box"><b>♻️ شروع دوباره</b><div class="mut">سکه‌ها ' + fmt(START) + ' میشه و تاریخچه پاک میشه</div><button class="btn sec" onclick="resetAll()">ریست</button></div>' +
              '<div class="box mut">این اپ فقط برای سرگرمیه و با سکه مجازی کار می‌کنه، پول واقعی در کار نیست.<br>مصرف اعتبار: باز کردن هر لیگ ۲ (تا ۳ ساعت تو حافظه می‌مونه)، بازارهای بیشتر هر بازی ۲، چک نتایج ۲ برای هر لیگ. نتایج فقط با زدن دکمه چک میشن.</div>';
          }
          function saveKey() {
            sv('key', $('k').value.trim()); sv('sports', null); toast('کلید ذخیره شد'); renderSet();
            loadSports(function () { renderLeagues(); if (reg != 'all') loadOdds(true); });
          }
          function coins(add) {
            var v = r2(+$('coin').value || 0);
            if (v < 0 || (add && v == 0)) { toast('یه عدد درست وارد کن'); return; }
            W.coins = add ? r2(W.coins + v) : v; saveAll(); renderSet();
            toast(add ? fc(v) + ' سکه اضافه شد' : 'موجودی شد ' + fc(v));
          }

          /* ---------- reminders ---------- */
          var REM = ld('rem', {});
          function setRem(m, on, silent) {
            var at = new Date(m.time).getTime() - 3600000;
            if (on) {
              if (at <= Date.now()) { if (!silent) toast('کمتر از یک ساعت به بازی مونده'); return; }
              REM[m.id] = { t: at, title: '⚽ یک ساعت دیگه بازی شروع میشه', text: m.home + ' - ' + m.away + ' | ساعت ' + hm(m.time) };
              try { Android.alarm(m.id, String(at), REM[m.id].title, REM[m.id].text); } catch (e) {}
              if (!silent) toast('🔔 یک ساعت قبل از بازی خبرت می‌کنم');
            } else {
              delete REM[m.id];
              try { Android.cancelAlarm(m.id); } catch (e) {}
              if (!silent) toast('🔕 یادآور خاموش شد');
            }
            sv('rem', REM);
          }
          function bell(id) { var m = MATCHES[id]; if (!m) return; setRem(m, !REM[id], false); rerender(); }
          function syncRem() {
            var now = Date.now();
            Object.keys(REM).forEach(function (id) {
              var r = REM[id];
              if (r.t <= now) delete REM[id];
              else { try { Android.alarm(id, String(r.t), r.title, r.text); } catch (e) {} }
            });
            sv('rem', REM);
          }
          function bonus() {
            var n = Date.now();
            if (n - (W.last || 0) < 86400000) { toast(fmt(Math.ceil((86400000 - (n - W.last)) / 3600000)) + ' ساعت دیگه دوباره بیا'); return; }
            W.last = n; W.coins = r2(W.coins + BONUS); saveAll(); toast('🎁 ' + fmt(BONUS) + ' سکه گرفتی');
          }
          function resetAll() {
            if (!confirm('مطمئنی؟ همه شرط‌ها پاک میشن')) return;
            W = { coins: START, last: 0 }; BETS = []; slip = []; sv('slip', slip); saveAll(); updateCnt(); renderSet(); toast('ریست شد');
          }

          renderBal(); updateCnt(); syncRem();
          loadSports(function () { renderLeagues(); loadOdds(false); });
          </script>
          </body>
          </html>
          EOF_X

      - name: Build
        working-directory: app
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/*.apk footballbet.apk

      - uses: actions/upload-artifact@v4
        with:
          name: footballbet-apk
          path: footballbet.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Football Bet v${{ github.run_number }}
          files: footballbet.apk
