            var h = '<div class="box"><div class="row"><b>' + (slip.length > 1 ? 'میکس ' + fmt(slip.length) + ' تایی' : 'شرط تکی') + '</b><span class="x" onclick="clearSlip()">پاک کردن همه</span></div>';
            slip.forEach(function (x, i) {
              h += '<div class="sl"><div class="row"><span class="ltr mut">' + esc(x.home) + ' - ' + esc(x.away) + '</span><span class="x" onclick="rm(' + i + ')">✕</span></div>' +
                '<div class="row"><span>' + esc(pl(x)) + '</span><b class="gold">' + x.odd.toFixed(2) + '</b></div><div class="mut">' + tm(x.time) + '</div></div>';
            });
            h += '<div class="row"><span>ضریب کل</span><b class="gold ltr">' + totalOdd().toFixed(2) + '</b></div>';
            h += '<textarea id="note" placeholder="📝 چرا این شرط رو می‌بندی؟ (اختیاری، مثلاً: فلان تیم ۳ بازیه گل نزده)" oninput="NOTE=this.value">' + esc(NOTE) + '</textarea>';
            h += '<input id="stake" type="number" step="0.01" inputmode="decimal" placeholder="مبلغ شرط (سکه)" oninput="calc()">';
            h += '<div class="quick"><button onclick="qs(50)">۵۰</button><button onclick="qs(100)">۱۰۰</button><button onclick="qs(500)">۵۰۰</button><button onclick="qs(-1)">همه</button></div>';
            h += '<div class="row"><span>برد احتمالی</span><b id="win" style="color:var(--green)">۰</b></div>';
            h += '<button class="btn" onclick="place()">✅ ثبت شرط</button></div>';
