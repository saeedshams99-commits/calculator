          }
          function qs(v) { $('stake').value = v < 0 ? r2(W.coins) : v; calc(); }
          function calc() { var s = r2(+$('stake').value || 0); $('win').textContent = fc(s * totalOdd()); }
          function place() {
            var s = r2(+$('stake').value || 0), now = Date.now();
            if (s <= 0) { toast('مبلغ شرط رو وارد کن'); return; }
            if (s > r2(W.coins)) { toast('سکه کافی نداری'); return; }
            for (var i = 0; i < slip.length; i++) if (new Date(slip[i].time).getTime() <= now) { toast('بازی ' + slip[i].home + ' شروع شده، از بلیط حذفش کن'); return; }
            BETS.unshift({
              id: 'b' + now, t: now, stake: s, odd: Math.round(totalOdd() * 100) / 100, st: 'p', win: 0,
              sel: slip.map(function (x) { var y = JSON.parse(JSON.stringify(x)); y.res = 'p'; return y; })
