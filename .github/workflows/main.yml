              var amt = b.st == 'l' ? '۰' : (b.st == 'p' ? fc(b.stake * b.odd) : '+' + fc(b.win));
              h += '<div class="row"><span class="mut">مبلغ ' + fc(b.stake) + ' | ضریب ' + b.odd.toFixed(2) + '</span><b style="color:' + (b.st == 'l' ? 'var(--red)' : 'var(--green)') + '">' + amt + '</b></div>';
              if (b.note) h += '<div class="note">📝 <b>چرا بستم:</b> ' + esc(b.note) + '</div>';
              if (b.lesson) h += '<div class="note" style="border-right:3px solid var(--gold)">📚 <b>درس بعد بازی:</b> ' + esc(b.lesson) + '</div>';
              h += '<div class="row" style="justify-content:space-around"><span class="more" onclick="editNote(\'' + b.id + '\',\'note\')">✏️ یادداشت</span>' +
                ((b.st == 'w' || b.st == 'l') ? '<span class="more" onclick="editNote(\'' + b.id + '\',\'lesson\')">📚 درس بعد بازی</span>' : '') + '</div>';
              if (needCheck(b, Date.now())) h += '<div class="more" onclick="checkResults(\'' + b.id + '\')">🔄 چک نتیجه همین شرط</div>';
              h += '</div>';
            });
            el.innerHTML = h;
          }

          /* ---------- settings ---------- */
          function renderSet() {
            var r = ld('remaining', '');
            $('set').innerHTML =
              '<div class="box"><b>🔑 کلید API</b><input id="k" class="ltr" placeholder="API key" value="' + esc(key()) + '"><button class="btn blue" onclick="saveKey()">ذخیره کلید</button>' +
              (r ? '<div class="mut" style="margin-top:8px">اعتبار باقی‌مونده این ماه: ' + esc(r) + '</div>' : '') + '</div>' +
              '<div class="box"><b>🔄 آپدیت برنامه</b><div class="mut">نسخه فعلی: ' + (BUILD ? 'v' + fa(BUILD) : '-') + '</div><button class="btn blue" onclick="checkUpdate(true)">بررسی آپدیت</button></div>' +
              '<div class="box"><b>🪙 مدیریت سکه</b><div class="mut">موجودی فعلی: ' + fc(W.coins) + '</div><input id="coin" type="number" step="0.01" inputmode="decimal" placeholder="تعداد سکه">' +
              '<div class="quick"><button onclick="coins(1)">➕ اضافه کن</button><button onclick="coins(0)">✏️ تنظیم موجودی</button></div></div>' +
              '<div class="box"><b>🔔 یادآور بازی</b><div class="mut">یک ساعت قبل از بازی‌هایی که روشون شرط می‌بندی (یا زنگوله‌شون رو روشن می‌کنی) نوتیفیکیشن میاد.</div></div>' +
              '<div class="box"><b>🎁 جایزه روزانه</b><div class="mut">هر ۲۴ ساعت ' + fmt(BONUS) + ' سکه رایگان</div><button class="btn" onclick="bonus()">دریافت جایزه</button></div>' +
              '<div class="box"><b>♻️ شروع دوباره</b><div class="mut">سکه‌ها ' + fmt(START) + ' میشه و تاریخچه پاک میشه</div><button class="btn sec" onclick="resetAll()">ریست</button></div>' +
              '<div class="box mut">این اپ فقط برای سرگرمیه و با سکه مجازی کار می‌کنه، پول واقعی در کار نیست.<br>مصرف اعتبار: باز کردن هر لیگ ۲ (تا ۳ ساعت تو حافظه می‌مونه)، بازارهای بیشتر هر بازی ۲، چک نتایج ۲ برای هر لیگ. نتایج فقط با زدن دکمه چک میشن.</div>';
          }
          function saveKey() {
            sv('key', $('k').value.trim()); sv('sports2', null); toast('کلید ذخیره شد'); renderSet();
            loadSports(function () { renderLeagues(); if (reg != 'all') loadOdds(true); });
          }
          function coins(add) {
            var v = r2(+$('coin').value || 0);
            if (v < 0 || (add && v == 0)) { toast('یه عدد درست وارد کن'); return; }
            W.coins = add ? r2(W.coins + v) : v; saveAll(); renderSet();
            toast(add ? fc(v) + ' سکه اضافه شد' : 'موجودی شد ' + fc(v));
          }

          /* ---------- reminders ---------- */
          var REM = ld('rem', {});
          function setRem(m, on, silent) {
            var at = new Date(m.time).getTime() - 3600000;
            if (on) {
              if (at <= Date.now()) { if (!silent) toast('کمتر از یک ساعت به بازی مونده'); return; }
              REM[m.id] = { t: at, title: '⚽ یک ساعت دیگه بازی شروع میشه', text: m.home + ' - ' + m.away + ' | ساعت ' + hm(m.time) };
              try { Android.alarm(m.id, String(at), REM[m.id].title, REM[m.id].text); } catch (e) {}
              if (!silent) toast('🔔 یک ساعت قبل از بازی خبرت می‌کنم');
            } else {
              delete REM[m.id];
              try { Android.cancelAlarm(m.id); } catch (e) {}
              if (!silent) toast('🔕 یادآور خاموش شد');
            }
            sv('rem', REM);
          }
          function bell(id) { var m = MATCHES[id]; if (!m) return; setRem(m, !REM[id], false); rerender(); }
          function syncRem() {
            var now = Date.now();
            Object.keys(REM).forEach(function (id) {
              var r = REM[id];
              if (r.t <= now) delete REM[id];
              else { try { Android.alarm(id, String(r.t), r.title, r.text); } catch (e) {} }
            });
            sv('rem', REM);
          }
          /* ---------- app update ---------- */
          function checkUpdate(manual) {
            if (!BUILD || REPO.indexOf('/') < 0) { if (manual) toast('آپدیت فقط تو نسخه ساخته‌شده کار می‌کنه'); return; }
            if (!manual && Date.now() - ld('updT', 0) < 12 * 3600000) { showUpd(false); return; }
            if (manual) toast('در حال بررسی آپدیت...');
            http('https://api.github.com/repos/' + REPO + '/releases/latest', function (r) {
              if (r.status != 200) { if (manual) toast('خطا در بررسی آپدیت (' + r.status + ')، VPN رو چک کن'); showUpd(false); return; }
              try {
                var j = JSON.parse(r.body), n = parseInt(String(j.tag_name).replace(/\D/g, ''), 10) || 0;
                var a = (j.assets || []).filter(function (x) { return /\.apk$/.test(x.name); })[0];
                sv('upd', { n: n, url: a ? a.browser_download_url : j.html_url }); sv('updT', Date.now());
              } catch (e) {}
              showUpd(manual);
            });
          }
          function showUpd(manual) {
            var u = ld('upd', null), el = $('upd');
            if (u && u.n > BUILD) el.innerHTML = '<div class="box upd"><div class="row"><b>🆕 نسخه جدید (v' + fa(u.n) + ') آماده‌ست</b></div><button class="btn" onclick="getUpd()">⬇️ دانلود و نصب</button></div>';
            else { el.innerHTML = ''; if (manual) toast('آخرین نسخه رو داری ✅'); }
            if (manual && u && u.n > BUILD) { go('matches'); }
          }
          function getUpd() { var u = ld('upd', null); if (!u) return; try { Android.openUrl(u.url); toast('بعد از دانلود، فایل رو باز کن و «به‌روزرسانی» رو بزن'); } catch (e) { toast('مرورگر باز نشد'); } }

          function bonus() {
            var n = Date.now();
            if (n - (W.last || 0) < 86400000) { toast(fmt(Math.ceil((86400000 - (n - W.last)) / 3600000)) + ' ساعت دیگه دوباره بیا'); return; }
            W.last = n; W.coins = r2(W.coins + BONUS); saveAll(); toast('🎁 ' + fmt(BONUS) + ' سکه گرفتی');
          }
          function resetAll() {
            if (!confirm('مطمئنی؟ همه شرط‌ها پاک میشن')) return;
            W = { coins: START, last: 0 }; BETS = []; slip = []; sv('slip', slip); saveAll(); updateCnt(); renderSet(); toast('ریست شد');
          }

          renderBal(); updateCnt(); syncRem();
          loadSports(function () { renderLeagues(); loadOdds(false); });
          setTimeout(function () { checkUpdate(false); }, 1200);
          </script>
          </body>
          </html>
          EOF_X
          sed -i "s/__BUILD__/$GITHUB_RUN_NUMBER/g" build.gradle src/main/assets/index.html
          sed -i "s#__REPO__#$GITHUB_REPOSITORY#g" src/main/assets/index.html

      - name: Build
        working-directory: app
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/*.apk footballbet.apk

      - uses: actions/upload-artifact@v4
        with:
          name: footballbet-apk
          path: footballbet.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Football Bet v${{ github.run_number }}
          files: footballbet.apk    
