              var odd = getOdd(m, p); if (!odd) return;
              var others = slip.filter(function (x) { return x.id != id; }), replaced = others.length < slip.length;
              if (others.length >= 15) { toast('حداکثر ۱۵ بازی تو یه میکس'); return; }
              others.push({ id: id, lg: m.lg, home: m.home, away: m.away, time: m.time, pick: p, odd: odd });
              slip = others;
              toast(replaced ? 'از هر بازی فقط یه انتخاب، جایگزین شد' : (slip.length > 1 ? 'اضافه شد، میکس ' + fmt(slip.length) + ' تایی' : 'به بلیط اضافه شد'));
            }
