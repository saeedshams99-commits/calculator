              cell('بالاترین ضریب برده', s.bigOdd ? s.bigOdd.toFixed(2) : '-') + cell('تکی / میکس برده', fa(s.sw) + ' از ' + fa(s.sn) + ' / ' + fa(s.mw) + ' از ' + fa(s.mn)) +
