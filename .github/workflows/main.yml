              (remn ? ' | اعتبار: ' + esc(remn) : '') + '</span>' + chip('🔄 بروزرسانی', false, multi ? 'loadMany(ld(\'oddsIdx\',[]))' : 'loadOdds(true)', 'sm') + '</div>';
            if (!ms.length) { list.innerHTML = h + '<div class="empty">برای این فیلتر بازی‌ای نیست</div>'; return; }
            var last = '';
            ms.forEach(function (m) {
              MATCHES[m.id] = m;
