          }
          function renderAll() {
            var idx = ld('oddsIdx', []), all = [], n = 0, now = Date.now();
            idx.forEach(function (k) { var c = ld('odds_' + k, null); if (c && now - c.t < 6 * 3600000 && c.d.length) { all = all.concat(c.d); n++; } });
            if (!all.length) {
              CUR = null;
              $('list').innerHTML = '<div class="empty">اینجا بازی‌های همه لیگ‌هایی که باز کردی، به ترتیب ساعت شروع نشون داده میشه.<br><br>' +
                chip('📥 دریافت لیگ‌های محبوب', false, 'loadMany(POP)') + '<div class="mut">(حدود ۱۴ اعتبار مصرف میشه)</div></div>';
              return;
