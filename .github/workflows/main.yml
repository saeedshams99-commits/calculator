name: Build APK

'on':
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Signing key
        run: |
          if [ ! -f fb.keystore ]; then
            keytool -genkeypair -keystore fb.keystore -storetype PKCS12 -storepass android -keypass android -alias fbkey -keyalg RSA -keysize 2048 -validity 20000 -dname "CN=Saeed, O=FootballBet, C=IR"
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add fb.keystore
            git commit -m "Add signing key"
            git push
          fi

      - name: Create project
