            var h = '<div class="box"><div class="row"><b>' + (slip.length > 1 ? 'میکس ' + fmt(slip.length) + ' تایی' : 'شرط تکی') + '</b><span class="x" onclick="clearSlip()">پاک کردن همه</span></div>';
            slip.forEach(function (x, i) {
              h += '<div class="sl"><div class="row"><span class="ltr mut">' + esc(x.home) + ' - ' + esc(x.away) + '</span><span class="x" onclick="rm(' + i + ')">✕</span></div>' +
                '<div class="row"><span>' + esc(pl(x)) + '</span><b class="gold">' + x.odd.toFixed(2) + '</b></div><div class="mut">' + tm(x.time) + '</div></div>';
            });
            h += '<div class="row"><span>ضریب کل</span><b class="gold ltr">' + totalOdd().toFixed(2) + '</b></div>';
