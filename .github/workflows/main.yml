name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Signing key
        run: |
          if [ ! -f fb.keystore ]; then
            keytool -genkeypair -keystore fb.keystore -storetype PKCS12 -storepass android -keypass android -alias fbkey -keyalg RSA -keysize 2048 -validity 20000 -dname "CN=Saeed, O=FootballBet, C=IR"
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add fb.keystore
            git commit -m "Add signing key"
            git push
          fi

      - name: Create Android project files
        run: bash create-project.sh

      - name: Build
        working-directory: app
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/*.apk footballbet.apk

      - uses: actions/upload-artifact@v4
        with:
          name: footballbet-apk
          path: footballbet.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Football Bet v${{ github.run_number }}
          files: footballbet.apk
