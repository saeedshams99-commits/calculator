          }
          function card(m) {
            var h = '<div class="match"><div class="mt"><span>🕒 ' + hm(m.time) + ' <span class="bell" onclick="bell(\'' + m.id + '\')">' + (REM[m.id] ? '🔔' : '🔕') + '</span></span><span>' + lname(m.lg) + '</span></div>' +
              '<div class="teams">' + esc(m.home) + '<br>' + esc(m.away) + '</div>' +
              '<div class="odds">' + ob(m, '1', '۱ میزبان') + ob(m, 'X', 'مساوی') + ob(m, '2', '۲ مهمان') + '</div>';
