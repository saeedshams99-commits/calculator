              if (k != last) { last = k; h += '<div class="day">📅 ' + dl(m.time) + '</div>'; }
              h += card(m);
            });
            list.innerHTML = h;
          }

          /* ---------- bet slip ---------- */
          function ptOf(p) { return p.length > 1 ? parseInt(p.slice(1), 10) / 10 : 2.5; }
          function pl(x) {
            var p = x.pick;
            if (p == '1') return 'برد ' + x.home; if (p == '2') return 'برد ' + x.away; if (p == 'X') return 'مساوی';
            if (p == 'BY') return 'هر دو تیم گل می‌زنن: بله'; if (p == 'BN') return 'هر دو تیم گل می‌زنن: خیر';
            return (p.charAt(0) == 'O' ? 'بیشتر از ' : 'کمتر از ') + fa(ptOf(p)) + ' گل';
          }
          function tog(id, p) {
            var m = MATCHES[id]; if (!m) return;
