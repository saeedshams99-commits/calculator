                  sec(m, 'مجموع گل ۱.۵', ['O15', 'بیشتر از ۱.۵'], ['U15', 'کمتر از ۱.۵']) +
                  ((m.ov && m.un) ? '' : sec(m, 'مجموع گل ۲.۵', ['O25', 'بیشتر از ۲.۵'], ['U25', 'کمتر از ۲.۵'])) +
                  sec(m, 'مجموع گل ۳.۵', ['O35', 'بیشتر از ۳.۵'], ['U35', 'کمتر از ۳.۵']);
