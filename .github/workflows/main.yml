          .mt{display:flex;justify-content:space-between;color:var(--mut);font-size:12px;margin-bottom:8px}
          .teams{font-weight:bold;margin-bottom:10px;line-height:1.7;direction:ltr;text-align:left}
          .odds{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:6px}
          .odds.two{grid-template-columns:repeat(2,1fr)}
          .ob{background:var(--card2);border-radius:8px;padding:8px 4px;text-align:center;border:1px solid transparent}
          .ob small{display:block;color:var(--mut);font-size:11px;margin-bottom:2px}
          .ob b{color:var(--gold)}
          .ob.sel{background:var(--acc);border-color:#fff3}
          .ob.sel b,.ob.sel small{color:#fff}
          .ob.dis{opacity:.35}
          nav{position:fixed;bottom:0;left:0;right:0;background:#0a2a4f;display:flex;box-shadow:0 -2px 8px #0006}
          nav button{flex:1;background:none;border:0;border-top:3px solid transparent;color:var(--mut);padding:10px 0;font-family:inherit;font-size:13px}
          nav button.on{color:#fff;border-top-color:var(--acc)}
          .badge{background:var(--red);color:#fff;border-radius:10px;padding:0 6px;font-size:11px;margin-right:4px}
          .page{display:none}.page.on{display:block}
          .box{background:var(--card);margin:10px 12px;border-radius:12px;padding:14px}
          .row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;gap:8px}
          .sl{border-bottom:1px solid #234;padding:8px 0}
          .x{color:var(--red);padding:0 6px}
          input{width:100%;background:var(--card2);border:1px solid #2a4a70;color:var(--txt);border-radius:8px;padding:10px;font-size:15px;font-family:inherit;margin:6px 0}
          .btn{width:100%;background:var(--green);color:#fff;border:0;border-radius:10px;padding:12px;font-size:15px;font-weight:bold;font-family:inherit;margin-top:8px}
          .btn.sec{background:var(--card2)}
          .btn.blue{background:var(--acc)}
          .quick{display:flex;gap:6px}.quick button{flex:1;background:var(--card2);color:var(--txt);border:0;border-radius:8px;padding:8px;font-family:inherit}
          .st{border-radius:6px;padding:2px 8px;font-size:12px}
          .st.p{background:#ffc10733;color:var(--gold)}.st.w{background:#2ecc7133;color:var(--green)}.st.l{background:#e74c3c33;color:var(--red)}
          .mut{color:var(--mut);font-size:12px}
          .ltr{direction:ltr;unicode-bidi:embed}
          .gold{color:var(--gold)}
          .empty{text-align:center;color:var(--mut);padding:40px 20px;line-height:2}
          .toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#000d;color:#fff;padding:10px 16px;border-radius:20px;display:none;z-index:9;max-width:90%;text-align:center}
          .spin{text-align:center;padding:30px;color:var(--mut)}
          .day{padding:12px 14px 2px;color:var(--gold);font-weight:bold;font-size:13px}
          .more{text-align:center;color:#64b5f6;padding:8px 0 2px;font-size:13px}
          .chip.sm{padding:5px 11px;font-size:12px}
          .lbl{color:var(--mut);font-size:12px;margin:8px 0 4px}
          .leagues:empty{display:none}
          .bell{margin-right:6px;font-size:15px}
          </style>
          </head>
          <body>
          <header><div class="logo">⚽ فوتبال بت</div><div class="bal" id="bal">0</div></header>
          <div id="p-matches" class="page on"><div id="leagues"></div><div id="list"></div></div>
          <div id="p-slip" class="page"><div id="slip"></div></div>
          <div id="p-bets" class="page"><div class="box"><button class="btn blue" onclick="checkResults()">🔄 بروزرسانی نتایج همه شرط‌ها</button></div><div id="bets"></div></div>
          <div id="p-set" class="page"><div id="set"></div></div>
          <nav>
          <button id="n-matches" class="on" onclick="go('matches')">⚽ بازی‌ها</button>
          <button id="n-slip" onclick="go('slip')">🎫 بلیط<span id="cnt"></span></button>
          <button id="n-bets" onclick="go('bets')">📋 شرط‌های من</button>
          <button id="n-set" onclick="go('set')">⚙️ تنظیمات</button>
          </nav>
          <div class="toast" id="toast"></div>
          <script>
          var API = 'https://api.the-odds-api.com/v4/sports/';
          var POP = ['soccer_epl', 'soccer_spain_la_liga', 'soccer_italy_serie_a', 'soccer_germany_bundesliga', 'soccer_france_ligue_one', 'soccer_uefa_champs_league', 'soccer_uefa_europa_league'];
          var FA = {
            soccer_epl: '🏴 لیگ برتر انگلیس', soccer_efl_champ: '🏴 چمپیونشیپ انگلیس', soccer_england_league1: '🏴 لیگ یک انگلیس',
            soccer_fa_cup: '🏴 جام حذفی انگلیس', soccer_spain_la_liga: '🇪🇸 لالیگا اسپانیا', soccer_spain_segunda_division: '🇪🇸 لالیگا ۲',
            soccer_italy_serie_a: '🇮🇹 سری آ ایتالیا', soccer_italy_serie_b: '🇮🇹 سری بی ایتالیا', soccer_germany_bundesliga: '🇩🇪 بوندسلیگا آلمان',
            soccer_germany_bundesliga2: '🇩🇪 بوندسلیگا ۲', soccer_france_ligue_one: '🇫🇷 لوشامپیونه فرانسه', soccer_france_ligue_two: '🇫🇷 لیگ ۲ فرانسه',
            soccer_uefa_champs_league: '🏆 لیگ قهرمانان اروپا', soccer_uefa_europa_league: '🏆 لیگ اروپا', soccer_uefa_europa_conference_league: '🏆 لیگ کنفرانس اروپا',
            soccer_netherlands_eredivisie: '🇳🇱 اردیویسی هلند', soccer_portugal_primeira_liga: '🇵🇹 لیگ برتر پرتغال', soccer_turkey_super_league: '🇹🇷 سوپرلیگ ترکیه',
            soccer_belgium_first_div: '🇧🇪 لیگ بلژیک', soccer_spl: '🏴 لیگ اسکاتلند', soccer_greece_super_league: '🇬🇷 سوپرلیگ یونان',
            soccer_japan_j_league: '🇯🇵 جی‌لیگ ژاپن', soccer_china_superleague: '🇨🇳 سوپرلیگ چین', soccer_korea_kleague1: '🇰🇷 کی‌لیگ کره',
            soccer_australia_aleague: '🇦🇺 ای‌لیگ استرالیا', soccer_mexico_ligamx: '🇲🇽 لیگا MX مکزیک', soccer_brazil_campeonato: '🇧🇷 سری آ برزیل',
            soccer_argentina_primera_division: '🇦🇷 لیگ آرژانتین', soccer_usa_mls: '🇺🇸 MLS آمریکا', soccer_chile_campeonato: '🇨🇱 لیگ شیلی',
            soccer_conmebol_copa_libertadores: '🏆 کوپا لیبرتادورس', soccer_conmebol_copa_sudamericana: '🏆 کوپا سودامریکانا',
            soccer_fifa_world_cup: '🌍 جام جهانی', soccer_uefa_nations_league: '🇪🇺 لیگ ملت‌های اروپا'
          };
          var REG = [['pop', '⭐ محبوب'], ['all', '⏰ همه به ترتیب ساعت'], ['eu', '🌍 اروپا'], ['asia', '🌏 آسیا'], ['am', '🌎 آمریکا'], ['nat', '🏳️ ملی'], ['other', '🌐 سایر']];
          var DFS = [['all', 'همه روزها'], ['today', 'امروز'], ['tom', 'فردا'], ['week', '۷ روز آینده']];
          var ODDS_TTL = 3 * 3600000, SCORE_TTL = 10 * 60000, EX_TTL = 60 * 60000, SPORTS_TTL = 12 * 3600000, START = 1000, BONUS = 100;
          var reg = 'pop', cur = POP[0], DF = 'all', CUR = null, CURM = false, NL = 0, MATCHES = {}, OPEN = {}, EX = {}, SPORTS = [], cbs = {}, cbn = 0;

          function $(id) { return document.getElementById(id); }
          function ld(k, d) { try { var v = Android.load(k); var r = v ? JSON.parse(v) : d; return r === null ? d : r; } catch (e) { return d; } }
          function sv(k, v) { Android.save(k, JSON.stringify(v)); }
          window.__cb = function (id, res) { var f = cbs[id]; delete cbs[id]; if (f) f(JSON.parse(res)); };
          function http(url, f) { var id = 'c' + (cbn++); cbs[id] = f; Android.get(url, id); }
          function key() { return ld('key', ''); }
          var LOWW = false;
          function rem(r) {
            if (r.remaining && r.remaining != 'null') {
              sv('remaining', r.remaining);
              if (+r.remaining < 50 && !LOWW) { LOWW = true; toast('⚠️ فقط ' + fa(+r.remaining) + ' اعتبار برات مونده'); }
            }
          }
          function fmt(n) { return Math.round(n).toLocaleString('fa-IR'); }
          function fa(n) { return n.toLocaleString('fa-IR'); }
          function r2(n) { return Math.round(n * 100) / 100; }
          function fc(n) { return r2(n).toLocaleString('fa-IR', { maximumFractionDigits: 2 }); }
          function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
          function L(t, o, m, loc) {
            var d = new Date(t);
            try { var oo = JSON.parse(JSON.stringify(o)); oo.timeZone = 'Asia/Tehran'; return d[m](loc || 'fa-IR', oo); }
            catch (e) { return d[m](loc || 'fa-IR', o); }
          }
          function tm(t) { return L(t, { weekday: 'short', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }, 'toLocaleString'); }
          function hm(t) { return L(t, { hour: '2-digit', minute: '2-digit' }, 'toLocaleTimeString'); }
          function dl(t) { return L(t, { weekday: 'long', day: 'numeric', month: 'long' }, 'toLocaleDateString'); }
          function dk(t) { return L(t, { year: 'numeric', month: '2-digit', day: '2-digit' }, 'toLocaleDateString', 'en-CA'); }
          function toast(t) { var e = $('toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(e._t); e._t = setTimeout(function () { e.style.display = 'none'; }, 2500); }
          function chip(t, on, act, cls) { return '<span class="chip' + (on ? ' on' : '') + (cls ? ' ' + cls : '') + '" onclick="' + act + '">' + t + '</span>'; }

          var W = ld('wallet', null); if (!W) { W = { coins: START, last: 0 }; sv('wallet', W); }
          var BETS = ld('bets', []);
          var slip = ld('slip', []);
          function saveAll() { sv('wallet', W); sv('bets', BETS); renderBal(); }
          function renderBal() { $('bal').textContent = '🪙 ' + fc(W.coins); }
          function updateCnt() { $('cnt').innerHTML = slip.length ? '<span class="badge">' + fmt(slip.length) + '</span>' : ''; }

          function go(p) {
            ['matches', 'slip', 'bets', 'set'].forEach(function (x) {
              $('p-' + x).classList.toggle('on', x == p);
              $('n-' + x).classList.toggle('on', x == p);
            });
            if (p == 'slip') renderSlip();
            if (p == 'bets') { settle(); renderBets(); }
            if (p == 'set') renderSet();
            if (p == 'matches') rerender();
            window.scrollTo(0, 0);
          }

          /* ---------- leagues ---------- */
          function loadSports(done) {
            var c = ld('sports', null);
            if (c && Date.now() - c.t < SPORTS_TTL && c.d.length) { SPORTS = c.d; done(); return; }
            var fb = function () { SPORTS = (c && c.d && c.d.length) ? c.d : POP.map(function (k) { return { key: k, title: k }; }); done(); };
            if (!key()) { fb(); return; }
            http(API + '?apiKey=' + encodeURIComponent(key()), function (r) {
              if (r.status == 200) {
                try {
                  var s = JSON.parse(r.body).filter(function (s) { return s.group && s.group.indexOf('Soccer') == 0 && s.active && !s.has_outrights && !/_winner$/.test(s.key); })
                    .map(function (s) { return { key: s.key, title: s.title }; });
                  if (s.length) { SPORTS = s; sv('sports', { t: Date.now(), d: s }); done(); return; }
                } catch (e) {}
              }
              fb();
            });
          }
          function lname(k) {
            if (FA[k]) return FA[k];
            for (var i = 0; i < SPORTS.length; i++) if (SPORTS[i].key == k) return '⚽ ' + esc(SPORTS[i].title);
            return k;
          }
          function regionOf(k) {
            if (/fifa|uefa_nations|uefa_european_championship|euro_qual|copa_america|gold_cup|asian_cup|africa_cup_of_nations|world_cup|friendl|international/.test(k)) return 'nat';
            if (/japan|china|korea|saudi|australia|iran|india|thailand|afc|qatar|uae|indonesia|vietnam/.test(k)) return 'asia';
            if (/mexico|brazil|argentina|usa|mls|chile|colombia|peru|conmebol|concacaf|libertadores|sudamericana|ecuador|uruguay|paraguay|bolivia|venezuela|canada|costa_rica/.test(k)) return 'am';
            if (/africa|egypt|morocco|tunisia|algeria|nigeria/.test(k)) return 'other';
            return 'eu';
          }
          function leaguesFor(g) {
            if (g == 'pop') {
              var have = {}; SPORTS.forEach(function (s) { have[s.key] = 1; });
              var p = POP.filter(function (k) { return have[k]; });
              return (p.length ? p : POP).map(function (k) { return { key: k }; });
            }
            return SPORTS.filter(function (s) { return regionOf(s.key) == g; }).sort(function (a, b) { return (FA[b.key] ? 1 : 0) - (FA[a.key] ? 1 : 0); });
          }
          function renderLeagues() {
            var h = '<div class="leagues">';
            REG.forEach(function (g) { if (g[0] == 'pop' || g[0] == 'all' || leaguesFor(g[0]).length) h += chip(g[1], reg == g[0], "pickReg('" + g[0] + "')"); });
            h += '</div>';
            if (reg != 'all') {
              h += '<div class="leagues">';
              leaguesFor(reg).forEach(function (s) { h += chip(lname(s.key), s.key == cur, "pickLeague('" + s.key + "')", 'sm'); });
              h += '</div>';
            }
            h += '<div class="leagues">';
