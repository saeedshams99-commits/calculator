          var MK = [['1', 'برد میزبان'], ['X', 'مساوی'], ['2', 'برد مهمان'], ['1X', '۱ یا مساوی'], ['X2', 'مساوی یا ۲'], ['12', '۱ یا ۲'],
            ['O15', 'بیشتر از ۱.۵'], ['U15', 'کمتر از ۱.۵'], ['O25', 'بیشتر از ۲.۵'], ['U25', 'کمتر از ۲.۵'], ['O35', 'بیشتر از ۳.۵'], ['U35', 'کمتر از ۳.۵'],
